# Install tmux plugins required by .tmux.conf
- name: Ensure tmux plugins directory exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/tmux/plugins"
    state: directory
    mode: '0755'
  tags:
    - tmux
    - plugins

- name: Install JetBrainsMono Nerd Font (macOS)
  homebrew_cask:
    name: font-jetbrains-mono-nerd-font
    state: present
  become: false
  when: ansible_facts['system'] == 'Darwin'
  tags:
    - tmux
    - plugins
    - fonts

# No tmux theme plugin — status bar uses manual Tokyo Night hex config in .tmux.conf
